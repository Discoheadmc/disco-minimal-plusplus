[package]
name = "disco_app"
description = "Disco Minimal++ — Freya arayüzü"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
disco_common.workspace = true
disco_core.workspace = true
disco_mc.workspace = true
disco_auth.workspace = true
disco_net.workspace = true
disco_content.workspace = true

freya.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
open.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
freya-testing.workspace = true

[package.metadata.packager]
product-name = "Disco Minimal++"
identifier = "com.discoheadmc.discominimalplus"
category = "Game"
publisher = "Discoheadmc"
copyright = "© 2026 Discoheadmc"
homepage = "https://github.com/Discoheadmc/disco-minimal-plusplus"
long-description = "Minimal ve performans odaklı Minecraft launcher — 100% Rust + Freya"
formats = ["nsis"]
binaries = [{ path = "disco_app", main = true }]
icons = [
  "icons/32x32.png",
  "icons/64x64.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
]

[package.metadata.packager.windows]
digest-algorithm = "sha256"
timestamp-url = "https://timestamp.digicert.com"
