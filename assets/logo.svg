<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Disco Minimal++ — PLACEHOLDER LOGO
    Geometrik "disco topu" silüeti + minimal "D" harfi izi.
    İleride gerçek logo gelene kadar geçici kullanım içindir.
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1120"/>
      <stop offset="100%" stop-color="#1b1f3a"/>
    </linearGradient>
    <linearGradient id="facetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
  </defs>

  <!-- Arka plan: yumuşak koyu lacivert kare -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad)"/>

  <!-- Disco topu: minimal fasetli küre -->
  <g>
    <circle cx="128" cy="128" r="88" fill="url(#facetGrad)" opacity="0.9"/>
    <!-- Faset çizgileri -->
    <g stroke="#0f1120" stroke-width="3" fill="none" opacity="0.55">
      <ellipse cx="128" cy="128" rx="88" ry="34"/>
      <ellipse cx="128" cy="128" rx="88" ry="66"/>
      <ellipse cx="128" cy="128" rx="34" ry="88"/>
      <ellipse cx="128" cy="128" rx="66" ry="88"/>
      <line x1="40" y1="128" x2="216" y2="128"/>
      <line x1="55" y1="62" x2="201" y2="194"/>
      <line x1="55" y1="194" x2="201" y2="62"/>
    </g>
    <!-- Parlak nokta -->
    <circle cx="96" cy="92" r="14" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- "++" vurgusu: minimal artı işaretleri -->
  <g stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round">
    <line x1="196" y1="34" x2="196" y2="58"/>
    <line x1="184" y1="46" x2="208" y2="46"/>
    <line x1="222" y1="60" x2="222" y2="84"/>
    <line x1="210" y1="72" x2="234" y2="72"/>
  </g>
</svg>
